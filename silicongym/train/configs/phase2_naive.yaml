# Phase 2a: GRPO on the NAIVE reward (compile + printed pass token, no safeguards). Expect reward hacking.
run_name: phase2_naive

model: {base: Qwen/Qwen2.5-Coder-1.5B, init_adapters: [], load_4bit: true}
lora: {r: 16, alpha: 32, dropout: 0.05}
data: {train: silicongym/data/tasks/train.jsonl}
env: {max_turns: 1}

reward:
  variant: naive
  safeguards: []             # nothing: hack detectors still flag and log, but do not change the reward

reward_workers: 4
wandb: {enabled: true, project: silicongym}

grpo:
  num_generations: 4
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  max_prompt_length: 384
  max_completion_length: 384
  temperature: 0.8
  learning_rate: 5.0e-6
  beta: 0.04
  max_steps: 300
  warmup_ratio: 0.05
  logging_steps: 5
  save_steps: 50
  save_total_limit: 2
  use_vllm: false
