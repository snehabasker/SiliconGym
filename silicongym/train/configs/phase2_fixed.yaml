# Phase 2b: same training, hardened reward/environment. One safeguard per hack type:
#   signed_output + ban_sim_control -> sim_control      multi_seed -> hardcoded_outputs
#   hack_penalty (detector flag -> negative reward) -> trivial_module, padding, fs_access
run_name: phase2_fixed

model: {base: Qwen/Qwen2.5-Coder-1.5B, init_adapters: [], load_4bit: true}
lora: {r: 16, alpha: 32, dropout: 0.05}
data: {train: silicongym/data/tasks/train.jsonl}
env: {max_turns: 1}

reward:
  variant: shaped
  compile_bonus: 0.1
  partial_weight: 0.8
  all_pass_bonus: 0.1
  length_threshold: 400
  length_penalty: 0.0005
  length_penalty_cap: 0.2
  safeguards: [signed_output, ban_sim_control, multi_seed, hack_penalty]
  hack_penalty: 0.5

reward_workers: 4
wandb: {enabled: true, project: silicongym}

grpo:
  num_generations: 4
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  max_prompt_length: 384
  max_completion_length: 384
  temperature: 0.8
  learning_rate: 5.0e-6
  beta: 0.04
  max_steps: 300
  warmup_ratio: 0.05
  logging_steps: 5
  save_steps: 50
  save_total_limit: 2
  use_vllm: false
