[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "silicongym"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.optional-dependencies]
train = ["torch", "transformers", "trl", "peft", "bitsandbytes", "accelerate", "datasets", "wandb"]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["silicongym*"]

[tool.setuptools.package-data]
"silicongym.data" = ["tasks/*.jsonl"]
